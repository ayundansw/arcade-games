<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Repair | RIT Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/game-ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <a href="../../index.html" class="exit-btn">EXIT MODULE</a>
        
        <div class="hud-panel">
            <h2>SYSTEM REPAIR</h2>
            <p>Connect the Data Stream from START to END.</p>
        </div>

        <div id="grid-container" class="grid-container">
            <!-- Grid generated by JS -->
        </div>

        <div id="winModal" class="modal-overlay">
            <div class="modal-content">
                <h2 class="modal-title" style="color: var(--neon-cyan)">SYSTEM ONLINE</h2>
                <p class="modal-score">DATA FLOW RESTORED</p>
                <button id="nextLevelBtn" class="retry-btn">NEXT SECTOR</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
