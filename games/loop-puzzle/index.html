<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found the Way | RIT Arcade</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/game-ui.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <a href="../../index.html" class="exit-btn">KEMBALI KE MENU</a>

        <!-- Left: Maze Grid -->
        <div id="grid-container" class="grid-container">
            <!-- Grid generated by JS -->
        </div>

        <!-- Right: HUD (Title, Desc, Timer) -->
        <div class="hud-panel">
            <h2>FOUND THE WAY</h2>
            <p>Escape the labyrinth. <br><br>
                WARNING: <span style="color:#ff4444">Hostile Entity detected.</span><br>
                It will hunt you down.</p>
            <div id="timer" class="timer-display">TIME: 60s</div>
        </div>

        <div id="winModal" class="modal-overlay">
            <div class="modal-content">
                <h2 class="modal-title" style="color: var(--neon-cyan)">SYSTEM ONLINE</h2>
                <p class="modal-score">DATA FLOW RESTORED</p>
                <button id="nextLevelBtn" class="retry-btn">NEXT SECTOR</button>
            </div>
        </div>
        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2 class="modal-title">SYSTEM FAILURE</h2>
                <p class="modal-score">DATA LOST: <span id="modal-score">Time Out</span></p>
                <!-- Buttons injected via JS -->
            </div>
        </div>

        <!-- System Boot Overlay -->
        <div id="countdown-overlay"
            style="display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; flex-direction: column; justify-content: center; align-items: center;">
            <div style="font-size: 2rem; color: var(--neon-cyan); margin-bottom: 20px;">SYSTEM INITIALIZING...</div>
            <div id="countdown-number" style="font-size: 8rem; color: #fff; text-shadow: 0 0 20px var(--neon-cyan);">5
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
