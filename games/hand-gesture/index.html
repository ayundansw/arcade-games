<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holo-Controller | RIT Arcade</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/game-ui.css">
    <link rel="stylesheet" href="style.css">

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="game-container">
        <a href="../../index.html" class="exit-btn">KEMBALI KE MENU</a>

        <video id="input_video" class="input_video" playsinline></video>
        <canvas id="output_canvas" class="output_canvas"></canvas>

        <div class="hud-overlay">
            <div class="score-display">SCORE: <span id="score">0</span></div>
            <div class="timer-display"
                style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: var(--neon-cyan); font-size: 2rem; font-weight: bold; text-shadow: 0 0 10px var(--neon-cyan);">
                TIME: <span id="time">60</span></div>
            <div class="ammo-display">SYSTEM: <span id="systemStatus" style="color: #00FF00;">ONLINE</span></div>
        </div>

        <!-- System Boot Overlay -->
        <div id="countdown-overlay"
            style="display: flex; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; flex-direction: column; justify-content: center; align-items: center;">
            <div style="font-size: 2rem; color: var(--neon-cyan); margin-bottom: 20px;">SYSTEM INITIALIZING...</div>
            <div id="countdown-number" style="font-size: 8rem; color: #fff; text-shadow: 0 0 20px var(--neon-cyan);">5
            </div>
        </div>

        <div id="gameOverModal" class="modal-overlay">
            <div class="modal-content">
                <h2 class="modal-title">MISSION REPORT</h2>
                <p class="modal-score">TARGETS ELIMINATED: <span id="finalScore">0</span></p>
                <div class="modal-buttons" style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                    <button id="retryBtn" class="retry-btn">RE-ENGAGE</button>
                    <button class="retry-btn" onclick="window.location.href='../../index.html'">ABORT MISSION</button>
                </div>
            </div>
        </div>

        <div id="rotateOverlay" class="rotate-overlay">
            <div class="rotate-content">
                <div class="rotate-icon">📱</div>
                <h2>PLEASE ROTATE DEVICE</h2>
                <p>Holo-Mode requires Landscape orientation.</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
