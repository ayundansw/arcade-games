<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIT Arcade Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto+Mono:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-overlay"></div>
    <div class="scanlines"></div>

    <header class="main-header">
        <h1 class="rit-logo" data-text="RIT ARCADE">RIT ARCADE</h1>
        <p class="subtitle">SELECT YOUR MODULE</p>
    </header>

    <main class="arcade-grid">
        <!-- Game 1: Dev-Bird -->
        <a href="games/dev-bird/index.html" class="game-card">
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" class="svg-icon" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z">
                        </path>
                        <path
                            d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z">
                        </path>
                        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"></path>
                        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"></path>
                    </svg>
                </div>
                <h2>DEV-PLANE</h2>
                <p>Terbang lewati firewall.</p>
                <div class="status">ONLINE</div>
            </div>
            <div class="card-border"></div>
        </a>

        <!-- Game 2: Loop Puzzle -->
        <a href="games/loop-puzzle/index.html" class="game-card">
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" class="svg-icon" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                        <line x1="6" y1="6" x2="6.01" y2="6"></line>
                        <line x1="6" y1="18" x2="6.01" y2="18"></line>
                    </svg>
                </div>
                <h2>FOUND THE WAY</h2>
                <p>Temukan jalan keluar.</p>
                <div class="status">ONLINE</div>
            </div>
            <div class="card-border"></div>
        </a>

        <!-- Game 3: Tech Quiz -->
        <a href="games/tech-quiz/index.html" class="game-card">
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" class="svg-icon" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <h2>RAPID FIRE</h2>
                <p>Uji wawasan teknologimu.</p>
                <div class="status">ONLINE</div>
            </div>
            <div class="card-border"></div>
        </a>

        <!-- Game 4: Hand Gesture -->
        <a href="games/hand-gesture/index.html" class="game-card">
            <div class="card-content">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" fill="none" class="svg-icon" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
                        <path d="M10 19a4 4 0 0 1-4.33-4.58 5.6 5.6 0 0 1 1-2.92"></path>
                        <path d="M6.5 11.5l.5-.5"></path>
                        <path d="M22 13a7 7 0 0 1-9.92 6"></path>
                    </svg>
                </div>
                <h2>HOLO-CONTROLLER</h2>
                <p>Kendali gestur tangan.</p>
                <div class="status">ONLINE</div>
            </div>
            <div class="card-border"></div>
        </a>
    </main>

    <footer class="main-footer">
        <p>SYSTEM STATUS: STABLE | <span id="clock">00:00:00</span></p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
